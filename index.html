<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#000;
    overflow:hidden;
}

.hero{
    height:100vh;
    width:100%;
    position:relative;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.30);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;
}

.logo{
    font-size:clamp(50px,8vw,140px);
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
}

.logo span{
    color:#ffe600;
}

.tagline{
    margin-top:30px;
    line-height:1.4;
    font-size:clamp(24px,2vw,42px);
}

.badge{
    margin-top:50px;

    border:2px solid white;
    border-radius:40px;

    padding:15px 40px;

    font-size:22px;
    letter-spacing:4px;
}

.footer{
    position:absolute;
    bottom:50px;

    text-align:center;

    color:white;
}

.footer .domain{
    font-size:32px;
    letter-spacing:8px;
    margin-bottom:10px;
}

.footer .text{
    font-size:18px;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="hero">

<img src="doemaarnormaal.png" alt="Doe Maar Normaal">

<div class="overlay">

<div class="logo">
DOE MAAR <span>NORMAAL</span>
</div>

<div class="tagline">
Bekende nummers.<br>
Eén stem.<br>
Eén gitaar.
</div>

<div class="badge">
IN ONTWIKKELING
</div>

<div class="footer">
<div class="domain">
doemaarnormaal.nl
</div>

<div class="text">
Binnenkort de eerste akoestische sessies.
</div>
</div>

</div>

</div>

</body>
</html>
