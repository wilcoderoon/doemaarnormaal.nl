<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:#000;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    display:block;
    background:#000;
}

.overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.15);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;

    padding:20px;
}

.logo{
    font-size:clamp(48px,8vw,140px);
    font-weight:900;
    line-height:0.95;
    text-transform:uppercase;
}

.logo span{
    color:#ffe600;
}

.tagline{
    margin-top:35px;
    font-size:clamp(18px,2vw,40px);
    line-height:1.4;
}

.badge{
    margin-top:45px;

    padding:15px 40px;

    border:2px solid white;
    border-radius:50px;

    font-size:20px;
    letter-spacing:4px;
    font-weight:600;

    backdrop-filter:blur(5px);
}

.footer{
    position:absolute;
    bottom:30px;

    text-align:center;
    color:white;
}

.domain{
    font-size:clamp(20px,2vw,34px);
    letter-spacing:8px;
    margin-bottom:8px;
}

.footer-text{
    font-size:16px;
    opacity:0.9;
}

@media (max-width: 768px){

    .logo{
        font-size:58px;
    }

    .tagline{
        font-size:22px;
    }

    .badge{
        font-size:16px;
        padding:12px 28px;
    }

    .domain{
        font-size:20px;
        letter-spacing:4px;
    }

    .footer-text{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="hero">

    <img src="doemaarnormaal.png" alt="Doe Maar Normaal">

    <div class="overlay">

        <div class="logo">
            DOE MAAR <span>NORMAAL</span>
        </div>

        <div class="tagline">
            Bekende nummers.<br>
            Eén stem.<br>
            Eén gitaar.
        </div>

        <div class="badge">
            IN ONTWIKKELING
        </div>

        <div class="footer">

            <div class="domain">
                doemaarnormaal.nl
            </div>

            <div class="footer-text">
                Binnenkort de eerste akoestische sessies.
            </div>

        </div>

    </div>

</div>

</body>
</html>
