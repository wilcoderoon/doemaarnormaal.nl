<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
}

/* achtergrondafbeelding */

.hero img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    display:block;
}

/* tekstblok */

.overlay{

    position:absolute;

    top:50%;
    right:8%;

    transform:translateY(-50%);

    width:28%;

    color:white;
}

.badge{

    display:inline-block;

    padding:12px 24px;

    border:1px solid #d7ba4c;
    border-radius:999px;

    color:#d7ba4c;

    font-size:13px;

    letter-spacing:3px;

    margin-bottom:50px;

    backdrop-filter:blur(8px);
}

.tagline{

    color:#ffd84d;

    font-size:42px;
    font-weight:700;

    line-height:1.3;

    margin-bottom:40px;

    text-shadow:0 4px 14px rgba(0,0,0,.8);
}

.description{

    color:#e5e5e5;

    font-size:24px;
    line-height:1.8;

    margin-bottom:60px;

    text-shadow:0 4px 14px rgba(0,0,0,.8);
}

.domain{

    color:#999;

    letter-spacing:5px;

    font-size:16px;
}

@media(max-width:1000px){

    .overlay{

        width:80%;

        left:10%;
        right:auto;

        bottom:40px;
        top:auto;

        transform:none;
    }

    .tagline{

        font-size:30px;
    }

    .description{

        font-size:18px;
    }
}

</style>

</head>

<body>

<div class="hero">

    <img src="doemaarnormaal.png" alt="Doe Maar Normaal">

    <div class="overlay">

        <div class="badge">
            PROJECT IN ONTWIKKELING
        </div>

        <div class="tagline">
            Bekende nummers.<br>
            Nieuwe verhalen.
        </div>

        <div class="description">
            Een serie akoestische live-uitvoeringen.
        </div>

        <div class="domain">
            doemaarnormaal.nl
        </div>

    </div>

</div>

</body>

</html>
