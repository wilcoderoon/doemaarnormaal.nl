<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.hero img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    display:block;
}

.overlay{

    position:absolute;

    top:50%;
    right:6%;

    transform:translateY(-50%);

    width:min(420px,30vw);

    color:#fff;
}

.badge{

    display:inline-block;

    padding:12px 24px;

    border:1px solid rgba(255,216,77,0.7);
    border-radius:999px;

    color:#ffd84d;

    font-size:13px;
    font-weight:600;

    letter-spacing:3px;

    margin-bottom:40px;

    background:rgba(0,0,0,0.15);
    backdrop-filter:blur(10px);

    text-shadow:0 2px 10px rgba(0,0,0,0.8);
}

.tagline{

    color:#ffd84d;

    font-size:clamp(34px,2.5vw,48px);
    font-weight:700;

    line-height:1.25;

    margin-bottom:50px;

    text-shadow:0 4px 20px rgba(0,0,0,0.9);
}

.domain{

    color:#d0d0d0;

    font-size:16px;

    letter-spacing:6px;

    text-shadow:0 4px 20px rgba(0,0,0,1);
}

/* Mobiel */

@media (max-width:1000px){

    .hero img{
        object-position:32% center;
    }

    .overlay{

        width:84%;

        left:8%;
        right:auto;

        top:auto;
        bottom:60px;

        transform:none;
    }

    .badge{

        font-size:11px;

        letter-spacing:2px;

        padding:10px 18px;

        margin-bottom:22px;
    }

    .tagline{

        font-size:30px;

        line-height:1.2;

        margin-bottom:30px;
    }

    .domain{

        font-size:14px;

        letter-spacing:3px;
    }
}

</style>
</head>

<body>

<div class="hero">

    <img src="doemaarnormaal.png" alt="Doe Maar Normaal">

    <div class="overlay">

        <div class="badge">
            PROJECT IN ONTWIKKELING
        </div>

        <div class="tagline">
            Bekende nummers.<br>
            Nieuwe verhalen.
        </div>

        <div class="domain">
            doemaarnormaal.nl
        </div>

    </div>

</div>

</body>
</html>
