<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
}

/* VOLLEDIGE AFBEELDING */

.hero img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    display:block;
}

/* TEKST RECHTS OP DE FOTO */

.overlay{

    position:absolute;

    top:50%;
    right:7%;

    transform:translateY(-50%);

    width:33%;

    color:white;
}

.badge{

    display:inline-block;

    padding:12px 24px;

    border:1px solid #d7ba4c;
    border-radius:999px;

    color:#d7ba4c;

    font-size:13px;
    letter-spacing:3px;

    margin-bottom:40px;

    backdrop-filter:blur(8px);
}

h1{

    font-size:clamp(60px,5vw,95px);
    line-height:0.92;
    font-weight:900;

    margin-bottom:35px;

    text-shadow:0 4px 20px rgba(0,0,0,.8);
}

h2{

    color:#ffd84d;

    font-size:clamp(24px,2vw,34px);
    line-height:1.4;

    margin-bottom:40px;

    text-shadow:0 2px 10px rgba(0,0,0,.8);
}

p{

    color:#e6e6e6;

    font-size:clamp(18px,1.25vw,22px);
    line-height:1.9;

    margin-bottom:55px;

    text-shadow:0 2px 10px rgba(0,0,0,.8);
}

.domain{

    color:#999;

    letter-spacing:6px;

    font-size:15px;

    text-shadow:0 2px 10px rgba(0,0,0,.8);
}

/* MOBIEL */

@media (max-width:1000px){

    body{
        overflow:auto;
    }

    .hero{
        height:100vh;
    }

    .overlay{

        width:80%;

        left:10%;
        right:auto;

        top:auto;
        bottom:50px;

        transform:none;
    }

    h1{
        font-size:52px;
    }

    h2{
        font-size:22px;
    }

    p{
        font-size:16px;
        line-height:1.7;
    }

    .domain{
        letter-spacing:3px;
    }
}

</style>
</head>

<body>

<div class="hero">

    <img src="doemaarnormaal.png" alt="Doe Maar Normaal">

    <div class="overlay">

        <div class="badge">
            PROJECT IN ONTWIKKELING
        </div>

        <h1>
            DOE MAAR<br>
            NORMAAL
        </h1>

        <h2>
            Bekende nummers.<br>
            Nieuwe verhalen.
        </h2>

        <p>
            Akoestische live-uitvoeringen.<br>
            Eigen interpretaties.<br>
            Terug naar de essentie.
        </p>

        <div class="domain">
            doemaarnormaal.nl
        </div>

    </div>

</div>

</body>
</html>
