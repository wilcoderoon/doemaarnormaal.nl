<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
}

.container{
    display:flex;
    min-height:100vh;
}

/* FOTO */

.image-section{
    width:65%;
    overflow:hidden;
}

.image-section img{
    width:100%;
    height:100vh;
    object-fit:cover;
    display:block;
}

/* TEKST */

.content{
    width:35%;
    background:#060606;

    display:flex;
    flex-direction:column;
    justify-content:center;

    padding:80px 60px;
}

.badge{
    display:inline-block;
    width:fit-content;

    padding:12px 24px;

    border:1px solid #d9bb54;
    border-radius:999px;

    color:#d9bb54;

    font-size:14px;
    letter-spacing:3px;
    margin-bottom:40px;
}

h1{
    font-size:82px;
    line-height:0.95;
    font-weight:900;

    margin-bottom:35px;
}

.highlight{
    color:#ffd84d;
}

h2{
    color:#ffd84d;

    font-size:28px;
    line-height:1.4;

    font-weight:700;

    margin-bottom:45px;
}

p{
    color:#d0d0d0;

    font-size:20px;
    line-height:1.9;

    margin-bottom:55px;
}

.button{
    display:inline-block;

    width:fit-content;

    padding:18px 34px;

    border:1px solid #ffd84d;
    border-radius:999px;

    color:#ffd84d;
    text-decoration:none;
    font-weight:700;

    letter-spacing:2px;

    transition:all .3s ease;
}

.button:hover{
    background:#ffd84d;
    color:#000;
}

.domain{
    margin-top:60px;

    color:#666;

    letter-spacing:4px;

    font-size:16px;
}

/* MOBIEL */

@media(max-width:1000px){

    .container{
        flex-direction:column;
    }

    .image-section{
        width:100%;
    }

    .image-section img{
        height:60vh;
    }

    .content{
        width:100%;
        padding:50px 30px;
    }

    h1{
        font-size:58px;
    }

    h2{
        font-size:24px;
    }

    p{
        font-size:18px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="image-section">
        <img src="doemaarnormaal.png" alt="Doe Maar Normaal">
    </div>

    <div class="content">

        <div class="badge">
            PROJECT IN ONTWIKKELING
        </div>

        <h1>
            DOE MAAR<br>
            NORMAAL
        </h1>

        <h2>
            Bekende nummers.<br>
            Nieuwe verhalen.
        </h2>

        <p>
            Akoestische live-uitvoeringen.<br>
            Eigen interpretaties.<br>
            Terug naar de essentie.
        </p>

        <a href="#" class="button">
            BINNENKORT MEER
        </a>

        <div class="domain">
            doemaarnormaal.nl
        </div>

    </div>

</div>

</body>
</html>
