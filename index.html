<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
}

/* volledige afbeelding */

.hero img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    display:block;
}

/* tekst over donkere rechterzijde */

.overlay{

    position:absolute;

    right:6%;
    top:50%;

    transform:translateY(-50%);

    width:28%;

    color:white;
}

/* badge */

.badge{

    display:inline-block;

    padding:12px 24px;

    border:1px solid rgba(255,216,77,0.7);
    border-radius:999px;

    color:#ffd84d;

    font-size:13px;
    letter-spacing:3px;

    margin-bottom:40px;

    background:rgba(0,0,0,0.15);
    backdrop-filter:blur(6px);
}

/* hoofdtekst */

.tagline{

    color:#ffd84d;

    font-size:clamp(34px,2.6vw,50px);
    font-weight:700;

    line-height:1.3;

    margin-bottom:60px;

    text-shadow:0 4px 20px rgba(0,0,0,.9);
}

/* domein */

.domain{

    color:#bbbbbb;

    letter-spacing:6px;
    font-size:16px;

    text-shadow:0 4px 20px rgba(0,0,0,.9);
}

/* mobiel */

@media(max-width:1000px){

    .overlay{

        width:80%;

        right:auto;
        left:10%;

        top:auto;
        bottom:40px;

        transform:none;
    }

    .tagline{

        font-size:30px;
    }

    .domain{

        letter-spacing:3px;
    }
}

</style>

</head>

<body>

<div class="hero">

    <img src="doemaarnormaal.png" alt="Doe Maar Normaal">

    <div class="overlay">

        <div class="badge">
            PROJECT IN ONTWIKKELING
        </div>

        <div class="tagline">
            Bekende nummers.<br>
            Nieuwe verhalen.
        </div>

        <div class="domain">
            doemaarnormaal.nl
        </div>

    </div>

</div>

</body>
</html>
