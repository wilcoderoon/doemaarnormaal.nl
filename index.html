<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    max-width:1000px;
    width:100%;
    padding:40px 20px;
}

.photo{
    width:100%;
    max-height:60vh;
    object-fit:contain;
    margin-bottom:40px;
}

h1{
    font-size:clamp(42px,6vw,90px);
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:20px;
}

.highlight{
    color:#ffe600;
}

.subtitle{
    font-size:clamp(22px,2vw,34px);
    line-height:1.5;
    margin-bottom:35px;
    opacity:0.95;
}

.badge{
    display:inline-block;

    padding:16px 36px;

    border:2px solid rgba(255,255,255,.8);

    border-radius:999px;

    font-size:18px;
    letter-spacing:4px;
    font-weight:700;

    margin-bottom:45px;
}

.domain{
    font-size:clamp(18px,2vw,28px);
    letter-spacing:8px;
    margin-bottom:12px;
}

.footer{
    font-size:15px;
    color:#ccc;
}

@media(max-width:768px){

    .photo{
        max-height:50vh;
    }

    h1{
        font-size:52px;
    }

    .subtitle{
        font-size:22px;
    }

    .domain{
        letter-spacing:3px;
    }

}

</style>
</head>

<body>

<div class="container">

    <img src="doemaarnormaal.png"
         alt="Doe Maar Normaal"
         class="photo">

    <h1>
        DOE MAAR <span class="highlight">NORMAAL</span>
    </h1>

    <div class="subtitle">
        Doe Maar.<br>
        Opnieuw verteld.
    </div>

    <div class="badge">
        IN ONTWIKKELING
    </div>

    <div class="domain">
        doemaarnormaal.nl
    </div>

    <div class="footer">
        Binnenkort de eerste akoestische sessies.
    </div>

</div>

</body>
</html>
