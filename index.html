<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:#000;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
}

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;
    text-align:center;

    background:
        linear-gradient(
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.35)
        );

    padding:20px;
}

.logo{
    font-size:clamp(42px,6vw,95px);
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-2px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.6);
}

.logo span{
    color:#ffe600;
}

.tagline{
    margin-top:30px;

    font-size:clamp(22px,2vw,38px);
    line-height:1.35;

    text-shadow:
        0 2px 8px rgba(0,0,0,.8);
}

.badge{
    margin-top:45px;

    padding:16px 42px;

    border:2px solid rgba(255,255,255,.9);

    border-radius:999px;

    backdrop-filter:blur(6px);

    background:rgba(0,0,0,.25);

    letter-spacing:4px;

    font-weight:700;

    font-size:18px;
}

.footer{
    position:absolute;
    bottom:28px;

    text-align:center;
}

.domain{
    font-size:clamp(18px,2vw,30px);
    letter-spacing:10px;
    margin-bottom:10px;
}

.footer-text{
    font-size:15px;
    opacity:.9;
}

.footer-sub{
    margin-top:8px;
    font-size:13px;
    opacity:.65;
}

@media(max-width:768px){

    .logo{
        font-size:52px;
    }

    .tagline{
        font-size:22px;
    }

    .badge{
        font-size:15px;
        padding:14px 28px;
    }

    .domain{
        letter-spacing:4px;
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="hero">

    <img src="doemaarnormaal.png" alt="Doe Maar Normaal">

    <div class="overlay">

        <div class="logo">
            DOE MAAR <span>NORMAAL</span>
        </div>

        <div class="tagline">
            Bekende nummers.<br>
            Eén stem.<br>
            Eén gitaar.
        </div>

        <div class="badge">
            IN ONTWIKKELING
        </div>

        <div class="footer">

            <div class="domain">
                doemaarnormaal.nl
            </div>

            <div class="footer-text">
                Binnenkort de eerste akoestische sessies.
            </div>

            <div class="footer-sub">
                Akoestische interpretaties van bekende Doe Maar-nummers.
            </div>

        </div>

    </div>

</div>

</body>

</html>
