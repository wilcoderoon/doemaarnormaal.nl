<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doe Maar Normaal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
    color:#fff;
}

.container{
    display:flex;
    width:100%;
    height:100vh;
}

/* FOTO */

.image-section{
    width:65%;
    background:
        radial-gradient(circle at 20% 20%, #00c853 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, #ff00aa 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, #ffd600 0%, transparent 40%),
        #000;

    display:flex;
    align-items:center;
    justify-content:center;
}

.image-section img{

    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    display:block;
}

/* TEKST */

.content{
    width:35%;
    background:#050505;

    display:flex;
    flex-direction:column;
    justify-content:center;

    padding:50px;
}

.badge{

    display:inline-block;
    width:fit-content;

    padding:10px 22px;

    border:1px solid #d9bb54;
    border-radius:999px;

    color:#d9bb54;

    font-size:13px;
    letter-spacing:3px;

    margin-bottom:35px;
}

h1{

    font-size:72px;
    line-height:0.92;
    font-weight:900;

    margin-bottom:30px;
}

h2{

    color:#ffd84d;

    font-size:22px;
    line-height:1.4;

    margin-bottom:35px;
}

p{

    color:#d0d0d0;

    font-size:18px;
    line-height:1.8;

    margin-bottom:40px;
}

.domain{

    color:#777;

    font-size:15px;

    letter-spacing:5px;

    margin-top:15px;
}

/* Mobiel */

@media(max-width:1100px){

    body{
        overflow:auto;
    }

    .container{
        flex-direction:column;
        height:auto;
    }

    .image-section{
        width:100%;
        height:55vh;
    }

    .content{
        width:100%;
        padding:40px 30px;
    }

    h1{
        font-size:52px;
    }

    h2{
        font-size:20px;
    }

    p{
        font-size:16px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="image-section">

        <img src="doemaarnormaal.png"
             alt="Doe Maar Normaal">

    </div>

    <div class="content">

        <div class="badge">
            PROJECT IN ONTWIKKELING
        </div>

        <h1>
            DOE MAAR<br>
            NORMAAL
        </h1>

        <h2>
            Bekende nummers.<br>
            Nieuwe verhalen.
        </h2>

        <p>
            Akoestische live-uitvoeringen.<br>
            Eigen interpretaties.<br>
            Terug naar de essentie.
        </p>

        <div class="domain">
            doemaarnormaal.nl
        </div>

    </div>

</div>

</body>
</html>
