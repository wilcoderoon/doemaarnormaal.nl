<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doe Maar Normaal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* volledige afbeelding zichtbaar */
        }
    </style>
</head>
<body>
    <div class="container">
        doemaarnormaal.png
    </div>
</body>
</html>
